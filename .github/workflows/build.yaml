name: Build KtxQuickLook

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно только для публикации Release по тегу

jobs:
  build:
    # Arm-раннер, но собираем x86_64 кросс-компиляцией (-arch x86_64) под macOS 10.15.
    # Если нужен нативный Intel-раннер, замените на `macos-15-intel`.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build qlgenerator (x86_64, min macOS 10.15)
        run: |
          set -euo pipefail
          B=build/KtxQuickLook.qlgenerator
          mkdir -p "$B/Contents/MacOS" "$B/Contents/Resources"
          cp Info.plist "$B/Contents/Info.plist"
          plutil -lint "$B/Contents/Info.plist"

          clang -arch x86_64 -mmacosx-version-min=10.15 \
                -bundle -O2 -Wall -Wno-deprecated-declarations -Wno-format-truncation \
                -Isrc \
                -o "$B/Contents/MacOS/KtxQuickLook" \
                src/main.c src/ktxcore.c src/GeneratePreviewForURL.c src/GenerateThumbnailForURL.c \
                -framework CoreFoundation -framework CoreServices \
                -framework CoreGraphics -framework ImageIO -framework QuickLook

          lipo -info "$B/Contents/MacOS/KtxQuickLook"
          otool -l "$B/Contents/MacOS/KtxQuickLook" | grep -A3 -E "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION" || true
          nm -gU "$B/Contents/MacOS/KtxQuickLook" | grep -E "QuickLookGeneratorPluginFactory|GeneratePreviewForURL|GenerateThumbnailForURL"

          codesign --force --sign - "$B"
          codesign --verify --verbose=2 "$B"

      - name: Package (ready-to-use bundle)
        run: |
          set -euo pipefail
          mkdir -p dist
          # ditto сохраняет структуру бандла; внутри zip лежит папка KtxQuickLook.qlgenerator
          ditto -c -k --keepParent build/KtxQuickLook.qlgenerator dist/KtxQuickLook.qlgenerator.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: KtxQuickLook-macos-x86_64
          path: dist/KtxQuickLook.qlgenerator.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KtxQuickLook.qlgenerator.zip
